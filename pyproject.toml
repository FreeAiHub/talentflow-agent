[project]
name = "talentflow-agent"
version = "0.1.0"
description = "AI platform for automated vacancy lead generation: parsing, scoring, personalized outreach"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "apscheduler>=3.10",
    "asyncpg>=0.31.0",
]

[dependency-groups]
# PEP 735 dev group: installed by `uv sync` automatically (no --extra needed).
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[project.optional-dependencies]
# LLM tracing is opt-in: the llm_calls table and structured logs already cover
# most needs, and this avoids running another service for everyone.
observability = ["langfuse>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talentflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Ruff >= 0.16 lints/formats Python blocks inside *.md by default. Docs are
# prose, not code under test — keep the linter on real Python sources only.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
# The sole examples/ file was a mock of a Vapi integration the codebase does
# not have; it was removed (see the commit for #27). Nothing needs an exclude.

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The parsers and API clients are async; tests are plain `async def`.
asyncio_mode = "auto"

# langfuse is an optional extra (`uv sync --extra observability`); type
# checking must not require it to be installed. APScheduler ships no stubs.
[[tool.mypy.overrides]]
module = ["langfuse", "langfuse.*", "apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true

